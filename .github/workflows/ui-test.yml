name: UI test (emulator)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check built-in feeds are reachable
        run: |
          for u in $(grep -oE 'https://[^"]+' app/src/main/java/com/smartnews/data/seed/DefaultCatalog.kt | grep -iE 'rss|feed|xml|outbound'); do
            code=$(curl -s -o /tmp/f -w "%{http_code}" -L -A "Mozilla/5.0 (Linux; Android 14) SmartNews/1.0" "$u" || true)
            items=$(grep -c -iE '<item|<entry' /tmp/f || true)
            echo "$code items=$items $u" | tee -a feeds.txt
          done
          for q in "https://news.google.com/rss?hl=ar&gl=EG&ceid=EG:ar" "https://news.google.com/rss/headlines/section/topic/NATION?hl=ar&gl=EG&ceid=EG:ar" "https://news.google.com/rss/headlines/section/topic/WORLD?hl=ar&gl=EG&ceid=EG:ar"; do
            code=$(curl -s -o /tmp/f -w "%{http_code}" -L "$q" || true); items=$(grep -c '<item>' /tmp/f || true)
            echo "$code items=$items $q" | tee -a feeds.txt
          done

      - name: Build app and test APKs
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run walkthrough on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell mkdir -p /data/local/tmp/shots
            ./gradlew --no-daemon connectedDebugAndroidTest || touch test-failed
            mkdir -p shots && adb pull /data/local/tmp/shots/. shots/ || true
            adb logcat -d -b crash > shots/crash.txt || true
            adb logcat -d SmartNewsTest:I AndroidRuntime:E '*:S' > shots/test-log.txt || true

      - name: Publish screenshots and report to ui-shots branch
        if: always()
        run: |
          mkdir -p shots
          cp feeds.txt shots/ 2>/dev/null || true
          find app/build/outputs/androidTest-results -name "*.xml" -exec cp {} shots/ \; 2>/dev/null || true
          [ -f test-failed ] && echo FAILED > shots/RESULT.txt || echo PASSED > shots/RESULT.txt
          cd shots
          git init -q -b ui-shots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "UI test ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-shots

      - name: Fail if the walkthrough failed
        run: '[ ! -f test-failed ]'
